name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore CursoCursor.slnx
      - name: Build
        run: dotnet build CursoCursor.slnx --no-restore --configuration Release
      - name: Test
        run: dotnet test CursoCursor.slnx --no-build --configuration Release --verbosity normal
